    - part: "Nominatins & Elections"
      chapters: 
        - 02_elections/elections.qmd
        
        
    - part: "Awards" 
      chapters:
        - 03_awards/awards.qmd
        
    
    - part: "Annual Meetings"
      chapters: 
        - 04_conferences/meetings.qmd
