  downloads: [pdf, epub]
  # sharing: [twitter, facebook]
  reader-mode: false
  favicon: images/atbc_favicon.png
  page-footer:
    left: |
      ATBC Manual
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  
