project:
  type: book
  output-dir: docs
  
book:
  title: "ATBC Manual"
  output-file: "atbc-manual"
  author: "ATBC Council"
  date: 11/15/2024
  # date: last-modified
  # original-date: 11/15/2024
  # doi
  url: https://herbvar-network.github.io/herbvar_manual
